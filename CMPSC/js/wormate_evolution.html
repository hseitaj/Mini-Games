<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mentagon Multiplayer Evolved</title>
  <style>
    /* Basic CSS for full-window canvas and UI */
    body {
      margin: 0;
      background-color: #000;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      background-color: #111;
    }
    /* Merged progress bar at the very top */
    #progressContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 40px;
      border-bottom: 2px solid #eee;
      background-color: #333;
      z-index: 10;
    }
    #progressBar {
      height: 100%;
      background-color: #0f0;
      width: 0%;
      text-align: center;
      line-height: 40px;
      font-weight: bold;
      color: #fff;
    }
    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      color: #f00;
      z-index: 20;
      display: none;
    }
    /* Login overlay styles */
    #loginOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #loginOverlay form {
      background: #222;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
    }
    #loginOverlay input[type="text"] {
      padding: 10px;
      width: 250px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    #loginOverlay input[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    /* Milestone celebration style */
    .milestoneText {
      position: absolute;
      font-size: 36px;
      font-weight: bold;
      color: #ff0;
      text-shadow: 2px 2px 4px #000;
      z-index: 15;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Login Overlay -->
  <div id="loginOverlay">
    <form id="loginForm">
      <h2>Mentagon Multiplayer</h2>
      <p>Enter your username:</p>
      <input type="text" id="usernameInput" required />
      <br>
      <input type="submit" value="Start Game" />
    </form>
  </div>

  <!-- Merged Progress Bar -->
  <div id="progressContainer">
    <div id="progressBar">Level 1: 0%</div>
  </div>
  <div class="game-over" id="gameOver">Game Over!</div>
  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <script>
    "use strict";

    /**************************************
     * Configuration and Global Variables *
     **************************************/
    const MAP_WIDTH = 3000;
    const MAP_HEIGHT = 3000;
    let VIEWPORT_WIDTH = window.innerWidth;
    let VIEWPORT_HEIGHT = window.innerHeight;
    const FPS = 60;
    const DT = 1000 / FPS;

    const INITIAL_LEVEL = 1;
    const INITIAL_FOOD_REQUIRED = 10;
    const LEVEL_INCREMENT = 10;
    const BASE_RADIUS = 20;
    const GROWTH_PER_FOOD = 0.5;
    const BASE_SPEED = 3;
    const SPEED_DECREMENT = 0.2;
    const MAX_LEVEL = 20;

    const NUM_BOTS = 5;
    const BOT_MIN_LEVEL = 1;
    const BOT_MAX_LEVEL = 5;
    const BOT_SPEED = 1.5;

    const NUM_FOOD = 300;
    const FOOD_MIN_RADIUS = 2;
    const FOOD_MAX_RADIUS = 6;

    const NUM_BIG_FOOD = 30;
    const BIG_FOOD_RADIUS = 15;
    function generateBigFoodMinLevel() {
      return Math.floor(randomRange(2, 6));
    }
    const BIG_FOOD_VALUE = 5;

    const NUM_COSMO = 20;

    let foodItems = [];
    let bigFoodItems = [];
    let botPlayers = [];
    let cosmoObjects = [];
    let player = null;
    let cameraOffset = { x: 0, y: 0 };
    const keys = {};
    let gameOver = false;

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = VIEWPORT_WIDTH;
    canvas.height = VIEWPORT_HEIGHT;
    const progressBar = document.getElementById("progressBar");
    const gameOverDiv = document.getElementById("gameOver");

    /****************************
     * Utility Helper Functions *
     ****************************/
    function distance(x1, y1, x2, y2) {
      return Math.hypot(x1 - x2, y1 - y2);
    }
    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }
    function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
      let closestX = Math.max(rx, Math.min(cx, rx + rw));
      let closestY = Math.max(ry, Math.min(cy, ry + rh));
      return distance(cx, cy, closestX, closestY) < cr;
    }

    /**********************
     * Game Object Classes*
     **********************/
    class Mentagon {
      constructor(username, x, y, level, color, isBot=false) {
        this.username = username;
        this.x = x;
        this.y = y;
        this.level = level;
        this.foodEaten = 0;
        this.foodRequired = INITIAL_FOOD_REQUIRED + (level - 1) * LEVEL_INCREMENT;
        this.color = color;
        this.isBot = isBot;
        this.radius = BASE_RADIUS + (level - 1) * 3;
        this.sides = (level <= MAX_LEVEL ? level + 2 : MAX_LEVEL + 2 + (level - MAX_LEVEL));
        if (this.isBot) {
          this.vx = randomRange(-BOT_SPEED, BOT_SPEED);
          this.vy = randomRange(-BOT_SPEED, BOT_SPEED);
        }
      }
      levelUp() {
        let leveledUp = false;
        while (this.foodEaten >= this.foodRequired) {
          this.foodEaten -= this.foodRequired;
          this.level++;
          this.foodRequired = INITIAL_FOOD_REQUIRED + (this.level - 1) * LEVEL_INCREMENT;
          this.radius += 3;
          if (this.level <= MAX_LEVEL) {
            this.sides = this.level + 2;
          } else {
            this.sides = MAX_LEVEL + 2 + (this.level - MAX_LEVEL);
          }
          leveledUp = true;
        }
        if (leveledUp && !this.isBot) {
          createMilestoneText(this.level);
        }
      }
      draw(context) {
        context.save();
        context.translate(this.x, this.y);
        const angle = (this.level * Math.PI) / 18;
        context.rotate(angle);
        context.beginPath();
        for (let i = 0; i < this.sides; i++) {
          const theta = (i / this.sides) * 2 * Math.PI;
          const px = this.radius * Math.cos(theta);
          const py = this.radius * Math.sin(theta);
          if (i === 0) context.moveTo(px, py);
          else context.lineTo(px, py);
        }
        context.closePath();
        context.fillStyle = this.color;
        context.fill();
        context.strokeStyle = "#fff";
        context.lineWidth = 2;
        context.stroke();
        context.restore();
      }
      collidesWithFood(food) {
        return distance(this.x, this.y, food.x, food.y) < (this.radius + food.radius);
      }
      collidesWithMentagon(other) {
        return distance(this.x, this.y, other.x, other.y) < (this.radius + other.radius);
      }
      update(keys) {
        let speed = BASE_SPEED - (this.level - 1) * SPEED_DECREMENT;
        if (speed < 0.5) speed = 0.5;
        let newX = this.x, newY = this.y;
        if (!this.isBot) {
          if (keys["ArrowUp"]) newY -= speed;
          if (keys["ArrowDown"]) newY += speed;
          if (keys["ArrowLeft"]) newX -= speed;
          if (keys["ArrowRight"]) newX += speed;
        } else {
          if (Math.random() < 0.02) {
            this.vx = randomRange(-BOT_SPEED, BOT_SPEED);
            this.vy = randomRange(-BOT_SPEED, BOT_SPEED);
          }
          newX += this.vx;
          newY += this.vy;
        }
        this.x = Math.max(0, Math.min(newX, MAP_WIDTH));
        this.y = Math.max(0, Math.min(newY, MAP_HEIGHT));
      }
    }

    class Food {
      constructor(x, y, radius, isBig=false) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.isBig = isBig;
        if (this.isBig) {
          this.minLevel = generateBigFoodMinLevel();
          this.foodValue = BIG_FOOD_VALUE;
          this.color = "#f80";
        } else {
          this.foodValue = 1;
          this.color = (Math.random() < 0.5) ? "#0f0" : "#ff0";
        }
        this.isBeingEaten = false;
        this.eatProgress = 0;
      }
      updateSuction(targetX, targetY) {
        this.eatProgress += 0.05;
        this.x += (targetX - this.x) * 0.1;
        this.y += (targetY - this.y) * 0.1;
        this.radius *= 0.95;
      }
      draw(context) {
        context.beginPath();
        context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        context.fillStyle = this.color;
        context.fill();
      }
    }

    class CosmoObject {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.size = randomRange(30, 80);
      }
      draw(context) {
        context.save();
        context.translate(this.x, this.y);
        switch(this.type) {
          case "plant":
            context.fillStyle = "#0a0";
            context.beginPath();
            context.arc(0, 0, this.size/2, 0, Math.PI*2);
            context.fill();
            break;
          case "moon":
            context.fillStyle = "#ccc";
            context.beginPath();
            context.arc(0, 0, this.size/2, 0, Math.PI*2);
            context.fill();
            break;
          case "fire":
            context.fillStyle = "#f00";
            drawStar(context, 0, 0, this.size/4, this.size/2, 5);
            break;
          case "water":
            context.fillStyle = "#00f";
            context.beginPath();
            context.arc(0, 0, this.size/2, 0, Math.PI*2);
            context.fill();
            break;
          case "ice":
            context.fillStyle = "#0ff";
            drawPolygon(context, 6, this.size/2);
            break;
          case "mineral":
            context.fillStyle = "#888";
            drawDiamond(context, this.size/2);
            break;
          default:
            context.fillStyle = "#fff";
            context.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        }
        context.restore();
      }
      applyEffect(player, currentTime) {
        if (distance(this.x, this.y, player.x, player.y) < (this.size/2 + player.radius)) {
          switch(this.type) {
            case "plant":
              player.speedModifier = 1;
              player.speedBoostUntil = currentTime + 5000;
              break;
            case "moon":
              player.foodEaten += 2;
              break;
            case "fire":
              player.foodEaten = Math.max(0, player.foodEaten - 2);
              break;
            case "water":
              player.speedModifier = -1;
              player.slowUntil = currentTime + 5000;
              break;
            case "ice":
              player.freezeUntil = currentTime + 2000;
              break;
            case "mineral":
              player.foodEaten += 5;
              break;
          }
          return true;
        }
        return false;
      }
    }

    function drawStar(ctx, cx, cy, innerRadius, outerRadius, points) {
      ctx.beginPath();
      let angle = Math.PI / points;
      for (let i = 0; i < 2 * points; i++) {
        let r = (i % 2 === 0) ? outerRadius : innerRadius;
        let a = i * angle;
        let x = cx + Math.cos(a) * r;
        let y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }
    function drawPolygon(ctx, sides, radius) {
      ctx.beginPath();
      for (let i = 0; i < sides; i++) {
        let theta = (i / sides) * 2 * Math.PI;
        let x = radius * Math.cos(theta);
        let y = radius * Math.sin(theta);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }
    function drawDiamond(ctx, halfSize) {
      ctx.beginPath();
      ctx.moveTo(0, -halfSize);
      ctx.lineTo(halfSize, 0);
      ctx.lineTo(0, halfSize);
      ctx.lineTo(-halfSize, 0);
      ctx.closePath();
      ctx.fill();
    }

    /*********************
     * Game Initialization *
     *********************/
    function initFood() {
      foodItems = [];
      for (let i = 0; i < NUM_FOOD; i++) {
        const x = randomRange(0, MAP_WIDTH);
        const y = randomRange(0, MAP_HEIGHT);
        const radius = randomRange(FOOD_MIN_RADIUS, FOOD_MAX_RADIUS);
        foodItems.push(new Food(x, y, radius, false));
      }
      bigFoodItems = [];
      for (let i = 0; i < NUM_BIG_FOOD; i++) {
        const x = randomRange(0, MAP_WIDTH);
        const y = randomRange(0, MAP_HEIGHT);
        bigFoodItems.push(new Food(x, y, BIG_FOOD_RADIUS, true));
      }
    }
    function initCosmoObjects() {
      cosmoObjects = [];
      const types = ["plant", "moon", "fire", "water", "ice", "mineral"];
      for (let i = 0; i < NUM_COSMO; i++) {
        let type = types[Math.floor(randomRange(0, types.length))];
        let x = randomRange(0, MAP_WIDTH);
        let y = randomRange(0, MAP_HEIGHT);
        cosmoObjects.push(new CosmoObject(x, y, type));
      }
    }
    function initBots() {
      botPlayers = [];
      for (let i = 0; i < NUM_BOTS; i++) {
        const level = Math.floor(randomRange(BOT_MIN_LEVEL, BOT_MAX_LEVEL + 1));
        const x = randomRange(0, MAP_WIDTH);
        const y = randomRange(0, MAP_HEIGHT);
        const colors = ["#ff5722", "#9c27b0", "#03a9f4", "#8bc34a", "#ffc107"];
        const color = colors[i % colors.length];
        let bot = new Mentagon("Bot" + (i + 1), x, y, level, color, true);
        botPlayers.push(bot);
      }
    }
    function initPlayer(username) {
      const x = randomRange(0, MAP_WIDTH);
      const y = randomRange(0, MAP_HEIGHT);
      player = new Mentagon(username, x, y, INITIAL_LEVEL, "#007bff");
      player.speedModifier = 0;
      player.freezeUntil = 0;
      player.speedBoostUntil = 0;
      player.slowUntil = 0;
    }
    function updateCamera() {
      cameraOffset.x = player.x - VIEWPORT_WIDTH / 2;
      cameraOffset.y = player.y - VIEWPORT_HEIGHT / 2;
      cameraOffset.x = Math.max(0, Math.min(cameraOffset.x, MAP_WIDTH - VIEWPORT_WIDTH));
      cameraOffset.y = Math.max(0, Math.min(cameraOffset.y, MAP_HEIGHT - VIEWPORT_HEIGHT));
    }
    function createMilestoneText(level) {
      let div = document.createElement("div");
      div.className = "milestoneText";
      div.innerText = "Milestone! Level " + level;
      document.body.appendChild(div);
      // Position the text at the player's viewport position.
      let px = player.x - cameraOffset.x;
      let py = player.y - cameraOffset.y;
      div.style.left = px + "px";
      div.style.top = py + "px";
      setTimeout(() => { div.style.opacity = "0"; }, 1000);
      setTimeout(() => { document.body.removeChild(div); }, 1500);
    }

    /***********************
     * Main Game Loop *
     ***********************/
    function gameLoop() {
      let currentTime = performance.now();
      if (currentTime > player.speedBoostUntil && player.speedModifier > 0) {
        player.speedModifier = 0;
      }
      if (currentTime > player.slowUntil && player.speedModifier < 0) {
        player.speedModifier = 0;
      }
      if (currentTime < player.freezeUntil) {
        // Player frozen: skip movement.
      } else {
        player.update(keys);
      }
      for (let bot of botPlayers) {
        bot.update();
      }
      for (let i = foodItems.length - 1; i >= 0; i--) {
        let food = foodItems[i];
        if (player.collidesWithFood(food) && player.radius > food.radius) {
          food.isBeingEaten = true;
        }
        if (food.isBeingEaten) {
          food.updateSuction(player.x, player.y);
          if (food.eatProgress >= 1) {
            foodItems.splice(i, 1);
            player.foodEaten += food.foodValue;
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            const radius = randomRange(FOOD_MIN_RADIUS, FOOD_MAX_RADIUS);
            foodItems.push(new Food(x, y, radius, false));
          }
        }
      }
      for (let i = bigFoodItems.length - 1; i >= 0; i--) {
        let food = bigFoodItems[i];
        if (player.collidesWithFood(food) && player.radius > food.radius && player.level >= food.minLevel) {
          food.isBeingEaten = true;
        }
        if (food.isBeingEaten) {
          food.updateSuction(player.x, player.y);
          if (food.eatProgress >= 1) {
            bigFoodItems.splice(i, 1);
            player.foodEaten += food.foodValue;
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            bigFoodItems.push(new Food(x, y, BIG_FOOD_RADIUS, true));
          }
        }
      }
      for (let bot of botPlayers) {
        for (let i = foodItems.length - 1; i >= 0; i--) {
          let food = foodItems[i];
          if (bot.collidesWithFood(food) && bot.radius > food.radius) {
            foodItems.splice(i, 1);
            bot.foodEaten += food.foodValue;
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            const radius = randomRange(FOOD_MIN_RADIUS, FOOD_MAX_RADIUS);
            foodItems.push(new Food(x, y, radius, false));
          }
        }
        for (let i = bigFoodItems.length - 1; i >= 0; i--) {
          let food = bigFoodItems[i];
          if (bot.collidesWithFood(food) && bot.radius > food.radius && bot.level >= food.minLevel) {
            bigFoodItems.splice(i, 1);
            bot.foodEaten += food.foodValue;
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            bigFoodItems.push(new Food(x, y, BIG_FOOD_RADIUS, true));
          }
        }
      }
      for (let bot of botPlayers) {
        if (player.collidesWithMentagon(bot)) {
          if (player.radius > bot.radius) {
            player.foodEaten += bot.level * 3;
            bot.x = randomRange(0, MAP_WIDTH);
            bot.y = randomRange(0, MAP_HEIGHT);
            bot.level = Math.floor(randomRange(BOT_MIN_LEVEL, BOT_MAX_LEVEL + 1));
            bot.radius = BASE_RADIUS + (bot.level - 1) * 3;
            bot.sides = bot.level + 2;
          } else if (bot.radius > player.radius) {
            gameOver = true;
          }
        }
      }
      player.levelUp();
      for (let bot of botPlayers) {
        if (bot.foodEaten >= INITIAL_FOOD_REQUIRED) {
          bot.level++;
          bot.foodEaten = 0;
          bot.radius += 3;
          bot.sides = bot.level + 2;
        }
      }
      for (let i = cosmoObjects.length - 1; i >= 0; i--) {
        let obj = cosmoObjects[i];
        if (obj.applyEffect(player, currentTime)) {
          cosmoObjects.splice(i, 1);
          const types = ["plant", "moon", "fire", "water", "ice", "mineral"];
          let type = types[Math.floor(randomRange(0, types.length))];
          cosmoObjects.push(new CosmoObject(randomRange(0, MAP_WIDTH), randomRange(0, MAP_HEIGHT), type));
        }
      }
      updateCamera();
      ctx.save();
      ctx.translate(-cameraOffset.x, -cameraOffset.y);
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
      for (let obj of cosmoObjects) {
        obj.draw(ctx);
      }
      for (let food of foodItems) {
        food.draw(ctx);
      }
      for (let food of bigFoodItems) {
        food.draw(ctx);
      }
      for (let bot of botPlayers) {
        bot.draw(ctx);
      }
      player.draw(ctx);
      ctx.restore();
      let progressPercent = Math.min(100, (player.foodEaten / player.foodRequired) * 100);
      progressBar.style.width = progressPercent + "%";
      progressBar.innerText = "Level " + player.level + ": " + Math.floor(progressPercent) + "%";
      if (gameOver) {
        gameOverDiv.style.display = "block";
      } else {
        requestAnimationFrame(gameLoop);
      }
    }

    /********************
     * Event Listeners *
     ********************/
    window.addEventListener("keydown", (e) => {
      let key = e.key;
      if (!key.startsWith("Arrow") && key !== " ") {
        key = key.toLowerCase();
      }
      keys[key] = true;
    });
    window.addEventListener("keyup", (e) => {
      let key = e.key;
      if (!key.startsWith("Arrow") && key !== " ") {
        key = key.toLowerCase();
      }
      keys[key] = false;
    });
    window.addEventListener("resize", () => {
      VIEWPORT_WIDTH = window.innerWidth;
      VIEWPORT_HEIGHT = window.innerHeight;
      canvas.width = VIEWPORT_WIDTH;
      canvas.height = VIEWPORT_HEIGHT;
    });

    /*********************
     * Initialization and Login *
     *********************/
    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const username = document.getElementById("usernameInput").value.trim();
        if (username) {
          document.getElementById("loginOverlay").style.display = "none";
          initGame(username);
        }
      });
    });
    function initGame(username) {
      initFood();
      initCosmoObjects();
      initBots();
      initPlayer(username);
      gameOver = false;
      document.getElementById("gameOver").style.display = "none";
      requestAnimationFrame(gameLoop);
    }

    /************************************
     * PEP 257–Style Documentation Block
     ************************************
     * Mentagon Multiplayer Evolved
     *
     * This file implements an evolved multiplayer-inspired game mode with a suctioning visual effect
     * for consuming food and enemies, a merged progress bar at the top showing level and food progress,
     * milestone celebrations with floating text, and various cosmic objects (plants, moon, fire, water, ice,
     * and minerals) that provide special effects.
     *
     * The player's Mentagon is a polygon that grows (in size and number of sides) as it consumes food.
     * Big food items and enemy consumption yield bonus food points.
     * Movement speed decreases as level increases, and additional angles are added beyond MAX_LEVEL.
     *
     * Controls:
     *   - Arrow keys: Move the player.
     *
     * Repository Structure:
     *   Mini-Games/
     *   └── CMPSC/
     *       ├── assets/         # Contains images, CSS, etc.
     *       ├── js/             # Contains JavaScript game files (including mentagon_multiplayer_evolved.html)
     *       ├── python/         # Contains downloadable Python scripts.
     *       └── website/        # Contains main website files.
     ************************************/

    /********************
     * Test Instructions
     ********************
     * To test:
     *   - Open the page and log in using the overlay.
     *   - Use the arrow keys to move your Mentagon.
     *   - Observe the progress bar at the top showing your level and progress toward leveling up.
     *   - When the progress bar fills, a milestone text appears and your level increases (with extra angles added beyond MAX_LEVEL).
     *   - Big food items appear and can only be consumed if your level is high enough.
     *   - When you eat an enemy, you gain bonus food points (enemy level × 3).
     *   - Cosmic objects (of various types) appear and apply special effects when approached.
     ************************************/

  </script>
</body>
</html>
