<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mentagon Multiplayer Evolved</title>
  <style>
    /* Basic CSS for full-window canvas and UI */
    body {
      margin: 0;
      background-color: #000;
      color: #eee;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      background-color: #111;
    }
    .ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      font-size: 18px;
    }
    /* Single merged progress bar */
    #progressContainer {
      position: absolute;
      top: 40px;
      left: 10px;
      width: 300px;
      height: 30px;
      border: 2px solid #eee;
      background-color: #333;
      z-index: 10;
      border-radius: 4px;
      overflow: hidden;
    }
    #progressBar {
      height: 100%;
      background-color: #0f0;
      width: 0%;
      border-radius: 4px;
      text-align: center;
      line-height: 30px;
      font-weight: bold;
      color: #000;
    }
    .game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      color: #f00;
      z-index: 20;
      display: none;
    }
    /* Login overlay styles */
    #loginOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #loginOverlay form {
      background: #222;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
    }
    #loginOverlay input[type="text"] {
      padding: 10px;
      width: 250px;
      font-size: 16px;
      margin-bottom: 15px;
    }
    #loginOverlay input[type="submit"] {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Login Overlay -->
  <div id="loginOverlay">
    <form id="loginForm">
      <h2>Mentagon Multiplayer</h2>
      <p>Enter your username:</p>
      <input type="text" id="usernameInput" required />
      <br>
      <input type="submit" value="Start Game" />
    </form>
  </div>

  <!-- UI Elements -->
  <div id="progressContainer" class="ui">
    <div id="progressBar">Level 1: 0%</div>
  </div>
  <div class="game-over" id="gameOver">Game Over!</div>

  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <script>
    "use strict";

    /**************************************
     * Configuration and Global Variables *
     **************************************/
    // Map settings (a huge map relative to the viewport)
    const MAP_WIDTH = 3000;
    const MAP_HEIGHT = 3000;
    let VIEWPORT_WIDTH = window.innerWidth;
    let VIEWPORT_HEIGHT = window.innerHeight;

    // Game update settings
    const FPS = 60;
    const DT = 1000 / FPS;

    // Player (Mentagon) settings
    const INITIAL_LEVEL = 1;
    const INITIAL_FOOD_REQUIRED = 10; // Level 1 requires 10 food points
    const LEVEL_INCREMENT = 10;       // Each level requires 10 more food
    const BASE_RADIUS = 20;           // Base radius at level 1
    const GROWTH_PER_FOOD = 0.5;        // Increase in radius per food eaten
    const BASE_SPEED = 3;             // Base movement speed (pixels per frame)
    const SPEED_DECREMENT = 0.2;      // Speed decreases per level (min speed 0.5)
    const MAX_LEVEL = 20;           // Up to level 20, then extra angles are added per level

    // Bot settings
    const NUM_BOTS = 5;
    const BOT_MIN_LEVEL = 1;
    const BOT_MAX_LEVEL = 5;
    const BOT_SPEED = 1.5;

    // Food settings
    const NUM_FOOD = 300;           // Increased number of regular food items
    const FOOD_MIN_RADIUS = 2;
    const FOOD_MAX_RADIUS = 6;

    // Big Food settings
    const NUM_BIG_FOOD = 30;        // More big food items
    const BIG_FOOD_RADIUS = 15;     // Big food is larger
    function generateBigFoodMinLevel() {
      return Math.floor(randomRange(2, 6));
    }
    const BIG_FOOD_VALUE = 5;       // Eating a big food gives 5 food points

    // Island (obstacle) settings
    const NUM_ISLANDS = 20;
    const ISLAND_MIN_SIZE = 50;
    const ISLAND_MAX_SIZE = 150;

    // Global arrays for game objects
    let foodItems = [];
    let bigFoodItems = [];
    let botPlayers = [];
    let islands = [];

    // The player object will be created after login.
    let player = null;

    // Camera offset for scrolling
    let cameraOffset = { x: 0, y: 0 };

    // Key state tracking
    const keys = {};

    // Game over flag
    let gameOver = false;

    // Get canvas and UI elements
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = VIEWPORT_WIDTH;
    canvas.height = VIEWPORT_HEIGHT;
    const progressBar = document.getElementById("progressBar");
    const gameOverDiv = document.getElementById("gameOver");

    /****************************
     * Utility Helper Functions *
     ****************************/
    function distance(x1, y1, x2, y2) {
      return Math.hypot(x1 - x2, y1 - y2);
    }
    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }
    function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
      let closestX = Math.max(rx, Math.min(cx, rx + rw));
      let closestY = Math.max(ry, Math.min(cy, ry + rh));
      return distance(cx, cy, closestX, closestY) < cr;
    }

    /**********************
     * Game Object Classes*
     **********************/
    /**
     * Class representing a Mentagon (player or bot).
     * The shape is a regular polygon with number of sides = level + 2.
     * After max level is reached, extra sides are added (one extra side per level above MAX_LEVEL).
     */
    class Mentagon {
      constructor(username, x, y, level, color, isBot=false) {
        this.username = username;
        this.x = x;
        this.y = y;
        this.level = level;
        this.foodEaten = 0;
        this.foodRequired = INITIAL_FOOD_REQUIRED + (level - 1) * LEVEL_INCREMENT;
        this.color = color;
        this.isBot = isBot;
        this.radius = BASE_RADIUS + (level - 1) * 3;
        // Calculate sides: normally level+2; if level > MAX_LEVEL add extra side for each level above.
        this.sides = (level <= MAX_LEVEL ? level + 2 : MAX_LEVEL + 2 + (level - MAX_LEVEL));
        if (this.isBot) {
          this.vx = randomRange(-BOT_SPEED, BOT_SPEED);
          this.vy = randomRange(-BOT_SPEED, BOT_SPEED);
        }
      }
      levelUp() {
        while (this.foodEaten >= this.foodRequired) {
          this.foodEaten -= this.foodRequired;
          this.level++;
          this.foodRequired = INITIAL_FOOD_REQUIRED + (this.level - 1) * LEVEL_INCREMENT;
          this.radius += 3;
          if (this.level <= MAX_LEVEL) {
            this.sides = this.level + 2;
          } else {
            this.sides = MAX_LEVEL + 2 + (this.level - MAX_LEVEL);
          }
        }
      }
      draw(context) {
        context.save();
        context.translate(this.x, this.y);
        // Rotate by an angle based on level for variety.
        const angle = (this.level * Math.PI) / 18;
        context.rotate(angle);
        context.beginPath();
        for (let i = 0; i < this.sides; i++) {
          const theta = (i / this.sides) * 2 * Math.PI;
          const px = this.radius * Math.cos(theta);
          const py = this.radius * Math.sin(theta);
          if (i === 0) context.moveTo(px, py);
          else context.lineTo(px, py);
        }
        context.closePath();
        context.fillStyle = this.color;
        context.fill();
        context.strokeStyle = "#fff";
        context.lineWidth = 2;
        context.stroke();
        context.restore();
      }
      collidesWithFood(food) {
        return distance(this.x, this.y, food.x, food.y) < (this.radius + food.radius);
      }
      collidesWithMentagon(other) {
        return distance(this.x, this.y, other.x, other.y) < (this.radius + other.radius);
      }
      update(keys) {
        let speed = BASE_SPEED - (this.level - 1) * SPEED_DECREMENT;
        if (speed < 0.5) speed = 0.5;
        let newX = this.x, newY = this.y;
        if (!this.isBot) {
          if (keys["ArrowUp"]) newY -= speed;
          if (keys["ArrowDown"]) newY += speed;
          if (keys["ArrowLeft"]) newX -= speed;
          if (keys["ArrowRight"]) newX += speed;
        } else {
          if (Math.random() < 0.02) {
            this.vx = randomRange(-BOT_SPEED, BOT_SPEED);
            this.vy = randomRange(-BOT_SPEED, BOT_SPEED);
          }
          newX += this.vx;
          newY += this.vy;
        }
        // Prevent moving into islands.
        let collision = false;
        for (let island of islands) {
          if (circleRectCollision(newX, newY, this.radius, island.x, island.y, island.w, island.h)) {
            collision = true;
            break;
          }
        }
        if (!collision) {
          this.x = Math.max(0, Math.min(newX, MAP_WIDTH));
          this.y = Math.max(0, Math.min(newY, MAP_HEIGHT));
        }
      }
    }

    /**
     * Class representing a food item.
     * Big food items have a minLevel requirement and higher food value.
     * Food items now animate a suction effect when being eaten.
     */
    class Food {
      constructor(x, y, radius, isBig=false) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.isBig = isBig;
        if (this.isBig) {
          this.minLevel = generateBigFoodMinLevel();
          this.foodValue = BIG_FOOD_VALUE;
          this.color = "#f80"; // Big food color
        } else {
          this.foodValue = 1;
          this.color = (Math.random() < 0.5) ? "#0f0" : "#ff0";
        }
        // For suction animation:
        this.isBeingEaten = false;
        this.eatProgress = 0; // 0 to 1, 1 = fully eaten
      }
      updateSuction(targetX, targetY) {
        // Increase progress and move towards target.
        this.eatProgress += 0.05; // Adjust speed of suction here.
        // Interpolate position toward target.
        this.x += (targetX - this.x) * 0.1;
        this.y += (targetY - this.y) * 0.1;
        // Shrink gradually.
        this.radius *= 0.95;
      }
      draw(context) {
        context.beginPath();
        context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        context.fillStyle = this.color;
        context.fill();
      }
    }

    /**
     * Class representing an Island (obstacle).
     */
    class Island {
      constructor(x, y, w, h) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
      }
      draw(context) {
        context.fillStyle = "#555";
        context.fillRect(this.x, this.y, this.w, this.h);
        context.strokeStyle = "#333";
        context.strokeRect(this.x, this.y, this.w, this.h);
      }
    }

    /****************************
     * Game Initialization *
     ****************************/
    function initFood() {
      foodItems = [];
      for (let i = 0; i < NUM_FOOD; i++) {
        const x = randomRange(0, MAP_WIDTH);
        const y = randomRange(0, MAP_HEIGHT);
        const radius = randomRange(FOOD_MIN_RADIUS, FOOD_MAX_RADIUS);
        foodItems.push(new Food(x, y, radius, false));
      }
      bigFoodItems = [];
      for (let i = 0; i < NUM_BIG_FOOD; i++) {
        const x = randomRange(0, MAP_WIDTH);
        const y = randomRange(0, MAP_HEIGHT);
        bigFoodItems.push(new Food(x, y, BIG_FOOD_RADIUS, true));
      }
    }
    function initIslands() {
      islands = [];
      for (let i = 0; i < NUM_ISLANDS; i++) {
        const w = randomRange(ISLAND_MIN_SIZE, ISLAND_MAX_SIZE);
        const h = randomRange(ISLAND_MIN_SIZE, ISLAND_MAX_SIZE);
        const x = randomRange(0, MAP_WIDTH - w);
        const y = randomRange(0, MAP_HEIGHT - h);
        islands.push(new Island(x, y, w, h));
      }
    }
    function initBots() {
      botPlayers = [];
      for (let i = 0; i < NUM_BOTS; i++) {
        const level = Math.floor(randomRange(BOT_MIN_LEVEL, BOT_MAX_LEVEL + 1));
        const x = randomRange(0, MAP_WIDTH);
        const y = randomRange(0, MAP_HEIGHT);
        const colors = ["#ff5722", "#9c27b0", "#03a9f4", "#8bc34a", "#ffc107"];
        const color = colors[i % colors.length];
        let bot = new Mentagon("Bot" + (i + 1), x, y, level, color, true);
        botPlayers.push(bot);
      }
    }
    function initPlayer(username) {
      const x = randomRange(0, MAP_WIDTH);
      const y = randomRange(0, MAP_HEIGHT);
      player = new Mentagon(username, x, y, INITIAL_LEVEL, "#007bff");
    }

    /**
     * Update camera to center on the player.
     */
    function updateCamera() {
      cameraOffset.x = player.x - VIEWPORT_WIDTH / 2;
      cameraOffset.y = player.y - VIEWPORT_HEIGHT / 2;
      cameraOffset.x = Math.max(0, Math.min(cameraOffset.x, MAP_WIDTH - VIEWPORT_WIDTH));
      cameraOffset.y = Math.max(0, Math.min(cameraOffset.y, MAP_HEIGHT - VIEWPORT_HEIGHT));
    }

    /***********************
     * Main Game Loop *
     ***********************/
    function gameLoop() {
      // Update positions.
      player.update(keys);
      for (let bot of botPlayers) {
        bot.update();
      }
      // Process food consumption for player.
      // For regular food:
      for (let i = foodItems.length - 1; i >= 0; i--) {
        let food = foodItems[i];
        if (player.collidesWithFood(food) && player.radius > food.radius) {
          // Instead of immediate removal, animate suction.
          food.isBeingEaten = true;
        }
        if (food.isBeingEaten) {
          food.updateSuction(player.x, player.y);
          if (food.eatProgress >= 1) {
            foodItems.splice(i, 1);
            player.foodEaten += food.foodValue;
            // Spawn new regular food.
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            const radius = randomRange(FOOD_MIN_RADIUS, FOOD_MAX_RADIUS);
            foodItems.push(new Food(x, y, radius, false));
          }
        }
      }
      // For big food:
      for (let i = bigFoodItems.length - 1; i >= 0; i--) {
        let food = bigFoodItems[i];
        if (player.collidesWithFood(food) && player.radius > food.radius && player.level >= food.minLevel) {
          food.isBeingEaten = true;
        }
        if (food.isBeingEaten) {
          food.updateSuction(player.x, player.y);
          if (food.eatProgress >= 1) {
            bigFoodItems.splice(i, 1);
            player.foodEaten += food.foodValue;
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            bigFoodItems.push(new Food(x, y, BIG_FOOD_RADIUS, true));
          }
        }
      }
      // Bots eating food.
      for (let bot of botPlayers) {
        for (let i = foodItems.length - 1; i >= 0; i--) {
          let food = foodItems[i];
          if (bot.collidesWithFood(food) && bot.radius > food.radius) {
            foodItems.splice(i, 1);
            bot.foodEaten += food.foodValue;
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            const radius = randomRange(FOOD_MIN_RADIUS, FOOD_MAX_RADIUS);
            foodItems.push(new Food(x, y, radius, false));
          }
        }
        for (let i = bigFoodItems.length - 1; i >= 0; i--) {
          let food = bigFoodItems[i];
          if (bot.collidesWithFood(food) && bot.radius > food.radius && bot.level >= food.minLevel) {
            bigFoodItems.splice(i, 1);
            bot.foodEaten += food.foodValue;
            const x = randomRange(0, MAP_WIDTH);
            const y = randomRange(0, MAP_HEIGHT);
            bigFoodItems.push(new Food(x, y, BIG_FOOD_RADIUS, true));
          }
        }
      }
      // Process collisions between player and bots.
      for (let bot of botPlayers) {
        if (player.collidesWithMentagon(bot)) {
          if (player.radius > bot.radius) {
            // Animate enemy suction if desired (for brevity, we instantly award food).
            player.foodEaten += bot.level * 3;
            // Respawn bot.
            bot.x = randomRange(0, MAP_WIDTH);
            bot.y = randomRange(0, MAP_HEIGHT);
            bot.level = Math.floor(randomRange(BOT_MIN_LEVEL, BOT_MAX_LEVEL + 1));
            bot.radius = BASE_RADIUS + (bot.level - 1) * 3;
            bot.sides = bot.level + 2;
          } else if (bot.radius > player.radius) {
            gameOver = true;
          }
        }
      }
      // Level up player and bots.
      player.levelUp();
      for (let bot of botPlayers) {
        if (bot.foodEaten >= INITIAL_FOOD_REQUIRED) {
          bot.level++;
          bot.foodEaten = 0;
          bot.radius += 3;
          bot.sides = bot.level + 2;
        }
      }
      updateCamera();
      // Render scene.
      ctx.save();
      ctx.translate(-cameraOffset.x, -cameraOffset.y);
      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
      // Draw islands.
      for (let island of islands) {
        island.draw(ctx);
      }
      // Draw food.
      for (let food of foodItems) {
        food.draw(ctx);
      }
      for (let food of bigFoodItems) {
        food.draw(ctx);
      }
      // Draw bots.
      for (let bot of botPlayers) {
        bot.draw(ctx);
      }
      // Draw player.
      player.draw(ctx);
      ctx.restore();

      // Update merged progress bar.
      let progressPercent = Math.min(100, (player.foodEaten / player.foodRequired) * 100);
      progressBar.style.width = progressPercent + "%";
      progressBar.innerText = "Level " + player.level + ": " + Math.floor(progressPercent) + "%";

      if (gameOver) {
        gameOverDiv.style.display = "block";
      } else {
        requestAnimationFrame(gameLoop);
      }
    }

    /********************
     * Event Listeners *
     ********************/
    window.addEventListener("keydown", (e) => {
      let key = e.key;
      if (!key.startsWith("Arrow") && key !== " ") {
        key = key.toLowerCase();
      }
      keys[key] = true;
    });
    window.addEventListener("keyup", (e) => {
      let key = e.key;
      if (!key.startsWith("Arrow") && key !== " ") {
        key = key.toLowerCase();
      }
      keys[key] = false;
    });
    window.addEventListener("resize", () => {
      VIEWPORT_WIDTH = window.innerWidth;
      VIEWPORT_HEIGHT = window.innerHeight;
      canvas.width = VIEWPORT_WIDTH;
      canvas.height = VIEWPORT_HEIGHT;
    });

    /*********************
     * Login and Initialization *
     *********************/
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const username = document.getElementById("usernameInput").value.trim();
      if (username) {
        document.getElementById("loginOverlay").style.display = "none";
        initGame(username);
      }
    });
    function initGame(username) {
      initFood();
      initIslands();
      initBots();
      initPlayer(username);
      gameOver = false;
      document.getElementById("gameOver").style.display = "none";
      requestAnimationFrame(gameLoop);
    }

    /************************************
     * PEP 257–Style Documentation Block
     ************************************
     * Mentagon Multiplayer Evolved
     *
     * This file implements an evolved multiplayer-inspired game mode called "Mentagon Multiplayer Evolved."
     * Players (and simulated bot opponents) spawn on a huge map filled with food circles (regular and big), islands,
     * and obstacles. The player's Mentagon is a regular polygon whose number of sides (and size) increases as they eat food.
     * A merged progress bar shows the level and progress toward the next level. When the progress bar fills,
     * the player levels up, gains additional angles, and their movement speed decreases slightly.
     *
     * Consumption Effects:
     *   - Food is now "suctioned" into the player with a visual hover/suction animation before being removed.
     *   - Big food items (which give more points) can only be eaten if the player's level is high enough.
     *   - When a player eats an enemy, extra food points (enemy level × 3) are awarded.
     *
     * Additional Features:
     *   - There are more food circles on the map.
     *   - A login overlay is used instead of a simple prompt.
     *   - Islands act as obstacles that block movement.
     *   - Once a maximum level is reached (MAX_LEVEL), extra sides are added for each level above.
     *
     * Controls:
     *   - Arrow keys: Move the player.
     *
     * Repository Structure:
     *   Mini-Games/
     *   └── CMPSC/
     *       ├── assets/         # Contains images, CSS, etc.
     *       ├── js/             # Contains JavaScript game files (including mentagon_multiplayer_evolved.html)
     *       ├── python/         # Contains downloadable Python scripts.
     *       └── website/        # Contains main website files.
     ************************************/

    /********************
     * Test Instructions
     ********************
     * To test:
     *   - Open the page and enter your username on the login screen.
     *   - Use the arrow keys to move your Mentagon.
     *   - Observe the progress bar filling as food is sucked in; when full, the level increases and extra angles are added.
     *   - Big food items appear; they can be consumed only if your level meets their requirement.
     *   - When you eat an enemy, you gain extra food (enemy level × 3).
     *   - Islands block movement.
     *   - The merged progress bar displays your current level and progress percentage.
     ************************************/

  </script>
</body>
</html>
