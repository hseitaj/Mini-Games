<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tetris Game</title>
  <style>
    /* Basic styling for the Tetris game canvas */
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 20px auto;
      background: #111;
      border: 2px solid #555;
    }
  </style>
</head>
<body>
  <canvas id="tetris" width="240" height="400"></canvas>
  <script>
    /**
     * Tetris Game Implementation.
     *
     * This mini game implements a version of Tetris using the HTML5 Canvas.
     * Features include:
     *   - Random piece generation (Tetrominoes: T, O, L, J, I, S, Z)
     *   - Piece movement (left/right/down)
     *   - Piece rotation with collision detection (simple wall-kick logic)
     *   - Locking pieces into a board
     *   - Clearing full rows and updating the board accordingly
     *   - A game loop driven by requestAnimationFrame
     *
     * Controls:
     *   Left Arrow  : Move piece left
     *   Right Arrow : Move piece right
     *   Down Arrow  : Soft drop piece
     *   Up Arrow    : Rotate piece
     */

    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const blockSize = 20;      // each block is 20x20 pixels
    const boardWidth = 10;     // Tetris board is 10 blocks wide
    const boardHeight = 20;    // and 20 blocks high
    context.scale(blockSize, blockSize);

    /**
     * Creates a matrix (2D array) of the given width and height filled with 0.
     *
     * @param {number} w - The width of the matrix.
     * @param {number} h - The height of the matrix.
     * @returns {Array} The created matrix.
     */
    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    /**
     * Draws a given matrix on the canvas at the specified offset.
     *
     * @param {Array} matrix - The matrix to draw.
     * @param {Object} offset - The offset with x and y properties.
     */
    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
            context.strokeStyle = '#000';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    /**
     * Merges the falling piece into the board.
     *
     * @param {Array} board - The game board.
     * @param {Object} piece - The current piece with a matrix and position.
     */
    function merge(board, piece) {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            board[y + piece.pos.y][x + piece.pos.x] = value;
          }
        });
      });
    }

    /**
     * Checks for collision between the board and the piece.
     *
     * @param {Array} board - The game board.
     * @param {Object} piece - The current piece.
     * @returns {boolean} True if there is a collision, false otherwise.
     */
    function collide(board, piece) {
      const m = piece.matrix;
      const o = piece.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0) {
            if (!board[y + o.y] || board[y + o.y][x + o.x] !== 0) {
              return true;
            }
          }
        }
      }
      return false;
    }

    /**
     * Clears full rows from the board.
     *
     * @param {Array} board - The game board.
     * @returns {number} The number of rows cleared.
     */
    function clearRows(board) {
      let rowCount = 0;
      outer: for (let y = board.length - 1; y >= 0; --y) {
        for (let x = 0; x < board[y].length; ++x) {
          if (board[y][x] === 0) {
            continue outer;
          }
        }
        board.splice(y, 1);
        board.unshift(new Array(boardWidth).fill(0));
        rowCount++;
        y++;  // recheck same row index after shifting
      }
      return rowCount;
    }

    /**
     * Rotates the matrix (piece) clockwise.
     *
     * @param {Array} matrix - The matrix to rotate.
     */
    function rotate(matrix) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      matrix.forEach(row => row.reverse());
    }

    /**
     * Creates a new Tetromino piece based on type.
     *
     * @param {string} type - One of the letters: T, O, L, J, I, S, Z.
     * @returns {Array} The matrix representing the piece.
     */
    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 1, 0],
          [1, 1, 1]
        ];
      } else if (type === 'O') {
        return [
          [2, 2],
          [2, 2]
        ];
      } else if (type === 'L') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [0, 3, 3]
        ];
      } else if (type === 'J') {
        return [
          [0, 4, 0],
          [0, 4, 0],
          [4, 4, 0]
        ];
      } else if (type === 'I') {
        return [
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0],
          [0, 5, 0, 0]
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0]
        ];
      } else if (type === 'Z') {
        return [
          [7, 7, 0],
          [0, 7, 7],
          [0, 0, 0]
        ];
      }
    }

    // Colors for pieces (index 0 is empty)
    const colors = [
      null,
      'purple', // T
      'yellow', // O
      'orange', // L
      'blue',   // J
      'cyan',   // I
      'green',  // S
      'red'     // Z
    ];

    // Create the game board
    const board = createMatrix(boardWidth, boardHeight);

    // Define the current falling piece
    const piece = {
      pos: { x: 0, y: 0 },
      matrix: null,
    };

    /**
     * Resets the current piece by creating a new random Tetromino and positioning it at the top.
     * If a collision occurs immediately, the board is cleared (game over scenario).
     */
    function resetPiece() {
      const pieces = 'TJLOSZI';
      piece.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
      piece.pos.y = 0;
      piece.pos.x = Math.floor(boardWidth / 2) - Math.floor(piece.matrix[0].length / 2);
      if (collide(board, piece)) {
        board.forEach(row => row.fill(0));
      }
    }

    let dropCounter = 0;
    const dropInterval = 1000;
    let lastTime = 0;

    /**
     * The main game loop that updates the game state and renders the board.
     *
     * @param {number} time - The current time (used for delta time calculation).
     */
    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        piece.pos.y++;
        if (collide(board, piece)) {
          piece.pos.y--;
          merge(board, piece);
          clearRows(board);
          resetPiece();
        }
        dropCounter = 0;
      }
      draw();
      requestAnimationFrame(update);
    }

    /**
     * Renders the current game state on the canvas.
     */
    function draw() {
      context.fillStyle = '#111';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(board, { x: 0, y: 0 });
      drawMatrix(piece.matrix, piece.pos);
    }

    // Keyboard event handling for piece control
    document.addEventListener('keydown', event => {
      if (event.keyCode === 37) { // left arrow
        piece.pos.x--;
        if (collide(board, piece)) {
          piece.pos.x++;
        }
      } else if (event.keyCode === 39) { // right arrow
        piece.pos.x++;
        if (collide(board, piece)) {
          piece.pos.x--;
        }
      } else if (event.keyCode === 40) { // down arrow (soft drop)
        piece.pos.y++;
        if (collide(board, piece)) {
          piece.pos.y--;
          merge(board, piece);
          clearRows(board);
          resetPiece();
        }
        dropCounter = 0;
      } else if (event.keyCode === 38) { // up arrow (rotate)
        const oldMatrix = piece.matrix.map(row => row.slice());
        rotate(piece.matrix);
        if (collide(board, piece)) {
          piece.matrix = oldMatrix;
        }
      }
    });

    // Start the game
    resetPiece();
    update();
  </script>
</body>
</html>
