<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Games Portal</title>
  <!-- Latest Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Mini Games Portal</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-4">
    <h1 class="mb-3">Welcome to Mini Games Portal</h1>
    <div class="row">
      <!-- Arena Clash Card -->
      <div class="col-md-6">
        <div class="card mb-4">
          <!-- Use the locally hosted image -->
          <img src="images/arena_clash.png" class="card-img-top" alt="Arena Clash">
          <div class="card-body">
            <h5 class="card-title">Arena Clash: Valor vs Nemesis</h5>
            <p class="card-text">An epic two-player arena game featuring heroes and minions.</p>
            <!-- Link to the game file in the games folder -->
            <a href="../games/arena_clash.py" class="btn btn-primary" target="_blank">Download Code</a>
          </div>
        </div>
      </div>
      <!-- Two-Player Tetris Card -->
      <div class="col-md-6">
        <div class="card mb-4">
          <img src="images/two_player_tetris.png" class="card-img-top" alt="Two-Player Tetris">
          <div class="card-body">
            <h5 class="card-title">Two-Player Tetris</h5>
            <p class="card-text">Enjoy a classic game of Tetris with a twist for two players.</p>
            <a href="../games/two_player_tetris.py" class="btn btn-primary" target="_blank">Download Code</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-4">
    <div class="container">
      <p>&copy; 2025 Your Name. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle CDN (optional, for interactivity) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
